# «Панорама Мастер» — предпросмотр по IP: http://201.51.1.60:8084/
# Боевой домен добавляется командой deploy/enable-domain.sh ДОМЕН (отдельный server-блок по имени).
server {
    listen 8084 default_server;
    listen [::]:8084 default_server;
    server_name _;
    include /etc/nginx/snippets/pmaster-common.conf;
}
