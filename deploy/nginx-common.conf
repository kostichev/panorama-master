# Общие настройки сайта «Панорама Мастер» (подключаются в каждый server-блок)
root /var/www/pmaster;
index index.html;
charset utf-8;

# служебные файлы репозитория не отдаём
location ~ /\.            { deny all; return 404; }
location ^~ /deploy/      { deny all; return 404; }
location ~* \.(md|sh|py|service|conf)$ { deny all; return 404; }

location = /api/lead {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    client_max_body_size 32k;
}

location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
location / { try_files $uri $uri/ $uri.html =404; }

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
# настоящий 404 (не отдаём главную вместо несуществующих страниц — так правильно для поиска)
